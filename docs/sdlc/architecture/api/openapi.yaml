      properties:
        id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
      required:
      - id
      - message_id
      - document_id
    usage_counters:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        document_count:
          type: integer
        total_document_bytes:
          type: string
        period_message_count:
          type: integer
        period_started_at:
          type: string
          format: date-time
      required:
      - user_id
      - document_count
      - total_document_bytes
      - period_message_count
      - period_started_at
