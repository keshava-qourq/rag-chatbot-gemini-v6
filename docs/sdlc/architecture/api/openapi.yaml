          type: string
          format: uuid
        email:
          type: string
        password_hash:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - password_hash
      - created_at
    documents:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        s3_key:
          type: string
        file_type:
          type: string
        size_bytes:
          type: string
        status:
          type: string
        failure_reason:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - name
      - s3_key
      - file_type
      - size_bytes
      - status
      - created_at
    chunks:
      type: object
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        chunk_index:
          type: integer
        content:
          type: string
        embedding:
          type: string
      required:
      - id
      - document_id
      - user_id
      - chunk_index
      - content
      - embedding
    chat_sessions:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - name
      - created_at
    session_documents:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
      required:
      - session_id
      - document_id
    messages:
      type: object
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        role:
          type: string
